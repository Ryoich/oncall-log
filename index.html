<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="当直記録">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>当直記録</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d1d1f; --sub: #6b7280; --line: #e5e7eb;
    --primary: #1f6feb; --danger: #d93025; --ok: #188038; --active: #fff7e6; --active-line: #f5a623;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --card: #1c1f23; --text: #eceff1; --sub: #9aa0a6; --line: #2e3238;
      --primary: #4c8dff; --danger: #ff6b5e; --ok: #4cc26f; --active: #2a2416; --active-line: #c98a1d;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 15px; color: var(--sub); font-weight: 600; margin: 24px 4px 8px; }
  button { font: inherit; border: 0; border-radius: 12px; cursor: pointer; }
  input { font: inherit; color: inherit; }

  .big-start { width: 100%; height: 140px; font-size: 28px; font-weight: 700; color: #fff;
    background: var(--primary); box-shadow: 0 4px 14px rgba(31,111,235,.35); }
  .big-start:active { transform: scale(.98); }

  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--line); }
  .active { background: var(--active); border-color: var(--active-line); }
  .active .row { display: flex; justify-content: space-between; align-items: baseline; }
  .elapsed { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .since { color: var(--sub); font-size: 14px; }
  .pid { width: 100%; font-size: 20px; padding: 10px 12px; margin: 10px 0; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); }
  .end-btn { width: 100%; height: 72px; font-size: 22px; font-weight: 700; color: #fff; background: var(--danger); }
  .link-btn { background: none; color: var(--sub); font-size: 13px; padding: 8px 0 0; text-decoration: underline; }

  .list { background: var(--card); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
  .item { display: grid; grid-template-columns: 3.6em 1fr auto; gap: 8px; align-items: center;
    padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item .d { color: var(--sub); font-size: 14px; }
  .item .p { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .p.none { color: var(--danger); font-weight: 400; }
  .item .t { font-variant-numeric: tabular-nums; text-align: right; font-size: 15px; }
  .item .t small { display: block; color: var(--sub); }
  .empty { color: var(--sub); text-align: center; padding: 24px; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .month-nav button { width: 48px; height: 44px; background: var(--card); color: var(--text); font-size: 20px; border: 1px solid var(--line); }
  .month-nav .m { font-size: 22px; font-weight: 700; }
  .summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .summary div { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .summary b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .summary span { color: var(--sub); font-size: 13px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .actions button, .sec-btn { height: 48px; background: var(--card); color: var(--primary); border: 1px solid var(--line); font-weight: 600; }
  .actions .wide { grid-column: 1 / -1; }
  .note { color: var(--sub); font-size: 13px; line-height: 1.6; margin: 8px 4px; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; height: 60px; background: none; color: var(--sub); font-size: 15px; border-radius: 0; }
  nav.tabs button.on { color: var(--primary); font-weight: 700; }

  dialog { border: 0; border-radius: 16px; padding: 20px; width: min(92vw, 420px); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 4px; }
  dialog input { width: 100%; padding: 10px; font-size: 17px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  dialog .btns { display: flex; gap: 10px; margin-top: 20px; }
  dialog .btns button { flex: 1; height: 46px; font-weight: 600; }
  .primary { background: var(--primary); color: #fff; }
  .ghost { background: var(--bg); color: var(--text); }
  .danger-text { background: none; color: var(--danger); width: 100%; margin-top: 12px; height: 40px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff;
    padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- 記録タブ -->
  <section id="tab-rec">
    <button id="start" class="big-start">対応開始</button>
    <div id="active-wrap"></div>
    <h2>本日の記録</h2>
    <div id="today" class="list"></div>
  </section>

  <!-- 一覧タブ -->
  <section id="tab-list" hidden>
    <div class="month-nav">
      <button id="prev" aria-label="前の月">‹</button>
      <span class="m" id="month-label"></span>
      <button id="next" aria-label="次の月">›</button>
    </div>
    <div class="summary">
      <div><b id="sum-count">0</b><span>件数</span></div>
      <div><b id="sum-time">0:00</b><span>合計時間</span></div>
    </div>
    <div id="month-list" class="list"></div>
    <div class="actions">
      <button id="csv">CSV出力</button>
      <button id="copy">テキストをコピー</button>
      <button id="add" class="wide">＋ 手動で追加</button>
    </div>

    <h2>バックアップ</h2>
    <div class="actions">
      <button id="backup">全データを保存</button>
      <button id="restore">復元</button>
    </div>
    <input id="restore-file" type="file" accept="application/json,.json" hidden>
    <p class="note">データはこの端末内にのみ保存され、外部には送信されません。機種変更やブラウザのデータ削除に備えて、ときどき「全データを保存」してください。</p>
  </section>
</main>

<nav class="tabs">
  <button data-tab="rec" class="on">記録</button>
  <button data-tab="list">月別一覧</button>
</nav>

<dialog id="edit">
  <form method="dialog" id="edit-form">
    <strong id="edit-title">記録の編集</strong>
    <label>患者ID</label>
    <input id="f-pid" autocomplete="off">
    <label>開始</label>
    <input id="f-start" type="datetime-local" required>
    <label>終了</label>
    <input id="f-end" type="datetime-local">
    <div class="btns">
      <button type="button" class="ghost" id="f-cancel">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
    <button type="button" class="danger-text" id="f-delete">この記録を削除</button>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'oncall.records.v1';
const $ = (s) => document.querySelector(s);

// ---- データ ----
// record: { id, pid, start(ms), end(ms|null) }
let records = load();
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(records));
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---- 時刻ユーティリティ ----
const pad = (n) => String(n).padStart(2, '0');
const floorMin = (ms) => Math.floor(ms / 60000) * 60000;
const hm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const md = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()}`; };
const ymd = (ms) => { const d = new Date(ms); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`; };
const durMin = (r) => Math.round((floorMin(r.end) - floorMin(r.start)) / 60000);
const fmtDur = (min) => `${Math.floor(min / 60)}:${pad(min % 60)}`;
const toLocalInput = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${hm(ms)}`; };
const fromLocalInput = (v) => v ? new Date(v).getTime() : null;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}
const buzz = () => navigator.vibrate && navigator.vibrate(30);

// ---- 記録タブ ----
$('#start').onclick = () => {
  const r = { id: uid(), pid: '', start: Date.now(), end: null };
  records.push(r); save(); buzz(); render();
  // 開始直後にID入力欄へフォーカス（後から入力してもOK）
  const input = document.querySelector(`[data-pid="${r.id}"]`);
  if (input) input.focus();
};

function renderActive() {
  const active = records.filter((r) => !r.end).sort((a, b) => b.start - a.start);
  $('#active-wrap').innerHTML = active.map((r) => `
    <div class="card active" style="margin-top:12px">
      <div class="row"><span class="elapsed" data-elapsed="${r.start}"></span><span class="since">${hm(r.start)} 開始</span></div>
      <input class="pid" data-pid="${r.id}" placeholder="患者IDを入力" value="${esc(r.pid)}" autocomplete="off" enterkeyhint="done">
      <button class="end-btn" data-end="${r.id}">対応終了</button>
      <button class="link-btn" data-cancel="${r.id}">誤って開始した場合は取り消し</button>
    </div>`).join('');
  tick();
}

function tick() {
  document.querySelectorAll('[data-elapsed]').forEach((el) => {
    const s = Math.max(0, Math.floor((Date.now() - Number(el.dataset.elapsed)) / 1000));
    el.textContent = `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  });
}
setInterval(tick, 1000);

$('#active-wrap').addEventListener('input', (e) => {
  const id = e.target.dataset.pid; if (!id) return;
  const r = records.find((x) => x.id === id); if (r) { r.pid = e.target.value.trim(); save(); }
});
$('#active-wrap').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset.pid) e.target.blur(); });
$('#active-wrap').addEventListener('click', (e) => {
  const endId = e.target.dataset.end, cancelId = e.target.dataset.cancel;
  if (endId) {
    const r = records.find((x) => x.id === endId);
    r.end = Date.now(); save(); buzz(); render();
    toast(r.pid ? `終了しました（${fmtDur(durMin(r))}）` : '終了しました。患者IDは一覧から入力できます');
  } else if (cancelId && confirm('この記録を取り消しますか？')) {
    records = records.filter((x) => x.id !== cancelId); save(); render();
  }
});

function itemHtml(r) {
  return `<div class="item" data-edit="${r.id}">
    <span class="d">${md(r.start)}</span>
    <span class="p ${r.pid ? '' : 'none'}">${r.pid ? esc(r.pid) : 'ID未入力'}</span>
    <span class="t">${hm(r.start)}–${hm(r.end)}<small>${fmtDur(durMin(r))}</small></span>
  </div>`;
}

function renderToday() {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  // 日付をまたぐ当直を考慮して「直近24時間 + 本日分」を表示
  const since = Math.min(t0.getTime(), Date.now() - 24 * 3600e3);
  const done = records.filter((r) => r.end && r.start >= since).sort((a, b) => b.start - a.start);
  $('#today').innerHTML = done.length ? done.map(itemHtml).join('') : '<div class="empty">まだ記録はありません</div>';
}

// ---- 一覧タブ ----
let cur = new Date(); cur = { y: cur.getFullYear(), m: cur.getMonth() };

function monthRecords() {
  const from = new Date(cur.y, cur.m, 1).getTime(), to = new Date(cur.y, cur.m + 1, 1).getTime();
  return records.filter((r) => r.end && r.start >= from && r.start < to).sort((a, b) => a.start - b.start);
}

function renderMonth() {
  $('#month-label').textContent = `${cur.y}年${cur.m + 1}月`;
  const list = monthRecords();
  $('#sum-count').textContent = list.length;
  $('#sum-time').textContent = fmtDur(list.reduce((s, r) => s + durMin(r), 0));
  $('#month-list').innerHTML = list.length ? list.map(itemHtml).join('') : '<div class="empty">この月の記録はありません</div>';
}
$('#prev').onclick = () => { cur.m--; if (cur.m < 0) { cur.m = 11; cur.y--; } renderMonth(); };
$('#next').onclick = () => { cur.m++; if (cur.m > 11) { cur.m = 0; cur.y++; } renderMonth(); };

function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('#csv').onclick = () => {
  const list = monthRecords();
  if (!list.length) return toast('この月の記録はありません');
  const rows = [['日付', '患者ID', '開始時刻', '終了時刻', '対応時間(分)']]
    .concat(list.map((r) => [ymd(r.start), r.pid, hm(r.start), hm(r.end), durMin(r)]));
  const csv = rows.map((row) => row.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  // Excelで文字化けしないようBOM付き
  download(`当直記録_${cur.y}${pad(cur.m + 1)}.csv`, '﻿' + csv, 'text/csv');
};

$('#copy').onclick = async () => {
  const list = monthRecords();
  if (!list.length) return toast('この月の記録はありません');
  const text = list.map((r) => `${ymd(r.start)}\t${r.pid}\t${hm(r.start)}\t${hm(r.end)}`).join('\n');
  try { await navigator.clipboard.writeText(text); toast('コピーしました（Excelに貼り付け可）'); }
  catch { toast('コピーできませんでした'); }
};

$('#backup').onclick = () => {
  download(`当直記録_backup_${ymd(Date.now()).replace(/\//g, '')}.json`, JSON.stringify(records, null, 1), 'application/json');
};
$('#restore').onclick = () => $('#restore-file').click();
$('#restore-file').onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data) || data.some((r) => !r.id || typeof r.start !== 'number')) throw 0;
    // 既存データと統合（同じIDはバックアップ側で上書き）
    const map = new Map(records.map((r) => [r.id, r]));
    data.forEach((r) => map.set(r.id, r));
    records = [...map.values()]; save(); render();
    toast(`${data.length}件を復元しました`);
  } catch { toast('ファイルを読み込めませんでした'); }
};

// ---- 編集ダイアログ ----
let editingId = null;
function openEdit(id) {
  editingId = id;
  const r = records.find((x) => x.id === id);
  const now = floorMin(Date.now());
  $('#edit-title').textContent = r ? '記録の編集' : '記録の追加';
  $('#f-pid').value = r ? r.pid : '';
  $('#f-start').value = toLocalInput(r ? r.start : now);
  $('#f-end').value = r && r.end ? toLocalInput(r.end) : (r ? '' : toLocalInput(now));
  $('#f-delete').hidden = !r;
  $('#edit').showModal();
}
document.addEventListener('click', (e) => {
  const row = e.target.closest('[data-edit]'); if (row) openEdit(row.dataset.edit);
});
$('#add').onclick = () => openEdit(null);
$('#f-cancel').onclick = () => $('#edit').close();
$('#f-delete').onclick = () => {
  if (!confirm('この記録を削除しますか？')) return;
  records = records.filter((x) => x.id !== editingId); save(); $('#edit').close(); render();
};
$('#edit-form').onsubmit = (e) => {
  const start = fromLocalInput($('#f-start').value), end = fromLocalInput($('#f-end').value);
  if (end && end < start) { e.preventDefault(); return toast('終了は開始より後にしてください'); }
  let r = records.find((x) => x.id === editingId);
  if (!r) { r = { id: uid() }; records.push(r); }
  Object.assign(r, { pid: $('#f-pid').value.trim(), start, end });
  save(); render();
};

// ---- タブ切替 ----
document.querySelectorAll('nav.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('#tab-rec').hidden = b.dataset.tab !== 'rec';
  $('#tab-list').hidden = b.dataset.tab !== 'list';
  render();
});

function render() { renderActive(); renderToday(); renderMonth(); }
render();

// 別タブ・復帰時にも最新状態を反映
window.addEventListener('storage', () => { records = load(); render(); });

// オフライン対応 & ストレージが自動削除されにくくする
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
</script>
</body>
</html>
